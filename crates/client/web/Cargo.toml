[package]
name = "randomtask-web"
version = "0.1.0"
edition = "2024"
description = "The randomtask app compiled to WebAssembly, for the web app's worker"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
randomtask-api = { version = "0.1.0", path = "../api" }
randomtask-app = { version = "0.1.0", path = "../app" }
randomtask-store = { version = "0.1.0", path = "../store" }
randomtask-vault = { version = "0.1.0", path = "../vault" }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false }
sqlite-wasm-vfs = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
