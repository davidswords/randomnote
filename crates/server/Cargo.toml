[package]
name = "randomtask-server"
version = "0.1.0"
edition = "2024"
description = "The randomtask server: accounts and sessions, following Standard Notes"
license = "GPL-3.0-only"

[dependencies]
axum = "0.8"
base64 = "0.23"
bcrypt = "0.19"
getrandom = "0.4"
randomtask-crypto = { version = "0.1.0", path = "../client/crypto" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"

# bcrypt is deliberately slow; optimise dependencies even in test builds.
[profile.dev.package."*"]
opt-level = 3
