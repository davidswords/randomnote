name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Run tests, requiring 100% coverage
        run: npm run test:coverage

  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  desktop-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Tauri's Linux dependencies, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb

      - run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Build the app
        run: npm run tauri -w @randomnote/desktop -- build --debug --no-bundle
      - name: Run end-to-end tests
        run: xvfb-run -a npm run test:e2e -w @randomnote/desktop

  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  cross-platform:
    name: cross-platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            command: test
            targets: ""
          - name: macos
            os: macos-15
            command: test
            targets: ""
          - name: ios
            os: macos-15
            command: check
            targets: aarch64-apple-ios
          - name: android
            os: ubuntu-latest
            command: check
            targets: aarch64-linux-android x86_64-linux-android
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add Rust targets
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - name: Use the Android NDK's C compilers for bundled SQLite
        if: matrix.name == 'android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CC_x86_64_linux_android=$bin/x86_64-linux-android24-clang"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build each crate for the platform
        env:
          COMMAND: ${{ matrix.command }}
          TARGETS: ${{ matrix.targets }}
        run: |
          for crate in crates/crypto crates/store; do
            if [ -z "$TARGETS" ]; then
              (cd "$crate" && cargo "$COMMAND" --locked)
            else
              for target in $TARGETS; do
                (cd "$crate" && cargo "$COMMAND" --locked --target "$target")
              done
            fi
          done
