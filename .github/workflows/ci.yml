name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Run tests, requiring 100% coverage
        run: npm run test:coverage

  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/client/store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  desktop-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Packages that finished downloading are kept even when a run fails, so a
      # slow mirror only delays the first runs, and later runs skip it.
      - name: Restore cached Ubuntu packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-

      - name: Install Tauri's Linux build dependencies
        # A stalled package mirror fails here quickly instead of using up the job's time.
        timeout-minutes: 10
        run: |
          # Prefer Canonical's own mirror; the runner's default has been slow.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o APT::Sandbox::User=root -o Dir::Cache::Archives="$HOME/apt-archives" install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Let the cache read the packages apt downloaded as root
        if: always()
        run: sudo chown -R "$USER" "$HOME/apt-archives"

      - name: Save Ubuntu packages for later runs
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Packages that finished downloading are kept even when a run fails, so a
      # slow mirror only delays the first runs, and later runs skip it.
      - name: Restore cached Ubuntu packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-

      - name: Install Tauri's Linux dependencies, WebKitWebDriver and Xvfb
        # A stalled package mirror fails here quickly instead of using up the job's time.
        timeout-minutes: 10
        run: |
          # Prefer Canonical's own mirror; the runner's default has been slow.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o APT::Sandbox::User=root -o Dir::Cache::Archives="$HOME/apt-archives" install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb

      - name: Let the cache read the packages apt downloaded as root
        if: always()
        run: sudo chown -R "$USER" "$HOME/apt-archives"

      - name: Save Ubuntu packages for later runs
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Build the app
        run: npm run tauri -w @randomtask/desktop -- build --debug --no-bundle
      - name: Run end-to-end tests
        run: xvfb-run -a npm run test:e2e -w @randomtask/desktop

  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/client/crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/client/vault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/client/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Run tests, requiring 100% line coverage
        run: cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '(^|/)(app|main)\.rs$'

  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the server with Docker Compose
        run: docker compose up --build --detach --wait

      - name: Check it answers for key parameters
        run: |
          for attempt in $(seq 1 30); do
            if body=$(curl --silent --fail --request POST http://127.0.0.1:8080/v2/login-params \
                --header 'content-type: application/json' \
                --data '{"email": "ci@example.com", "code_challenge": "test"}'); then
              echo "$body"
              grep -q '"version":"004"' <<<"$body"
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Stop the server
        if: always()
        run: docker compose down --volumes

  cross-platform:
    name: cross-platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            command: test
            targets: ""
          - name: macos
            os: macos-15
            command: test
            targets: ""
          - name: ios
            os: macos-15
            command: check
            targets: aarch64-apple-ios
          - name: android
            os: ubuntu-latest
            command: check
            targets: aarch64-linux-android x86_64-linux-android
          - name: web
            os: ubuntu-latest
            command: check
            targets: wasm32-unknown-unknown
            crates: crates/client/api
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add Rust targets
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - name: Use the Android NDK's C compilers for bundled SQLite
        if: matrix.name == 'android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CC_x86_64_linux_android=$bin/x86_64-linux-android24-clang"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build each crate for the platform
        env:
          COMMAND: ${{ matrix.command }}
          TARGETS: ${{ matrix.targets }}
          EXTRA_CRATES: ${{ matrix.crates }}
        run: |
          for crate in crates/client/crypto crates/client/store crates/client/vault $EXTRA_CRATES; do
            if [ -z "$TARGETS" ]; then
              (cd "$crate" && cargo "$COMMAND" --locked)
            else
              for target in $TARGETS; do
                (cd "$crate" && cargo "$COMMAND" --locked --target "$target")
              done
            fi
          done
